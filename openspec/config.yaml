schema: spec-driven

context: |
  You are an AI agent working with OpenSpec changes.
  This General Openspec instance uses the opsx: command prefix.

rules:
  proposal:
    - 必须包含 acceptance criteria

opsx:
  version: "0.1.0"

  profile: core-light

  layers:
    priority:
      - engine
      - backend
      - editor
      - runtime
      - ui-skin
      - meta
    paths:
      engine:
        - packages/engine/src/
        - packages/core/src/
        - packages/shared/src/
      backend:
        - server/src/
        - server/prisma/
      editor:
        - apps/editor/src/
      runtime:
        - apps/app/src/
      ui-skin:
        - packages/ui/src/
        - packages/components/src/

  verify:
    engine:
      typecheck: echo "[verify] engine layer typecheck (stub)"
      test: echo "[verify] engine layer test (stub)"
    backend:
      typecheck: echo "[verify] backend layer typecheck (stub)"
      test: echo "[verify] backend layer test (stub)"
    editor:
      typecheck: echo "[verify] editor layer typecheck (stub)"
      test: echo "[verify] editor layer test (stub)"
    runtime:
      typecheck: echo "[verify] runtime layer typecheck (stub)"
      test: echo "[verify] runtime layer test (stub)"
    ui-skin:
      typecheck: echo "[verify] ui-skin layer typecheck (stub)"
    meta:
      typecheck: echo "[verify] meta layer verified"
      test: echo "[verify] meta layer test (stub)"
    default:
      typecheck: echo "[verify] default typecheck (stub)"
      test: echo "[verify] default test (stub)"

  gates:
    schema_preflight: false
    artifact_precondition: false
    test_attribution: false
    archive_requires_verify: false

  git:
    auto_commit: false
    commit_prefix: "[opsx]"

  profiles:
    default: core-light
    strict-review:
      gates:
        schema_preflight: true
        archive_requires_verify: true
    enterprise:
      gates:
        schema_preflight: true
        artifact_precondition: true
        test_attribution: true
        archive_requires_verify: true
